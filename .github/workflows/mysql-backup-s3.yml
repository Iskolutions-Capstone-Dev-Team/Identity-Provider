name: MySQL Backup to S3

on:
  schedule:
    - cron: "0 0 * * *"        # Daily at midnight (00:00)
    - cron: "15,45 * * * *"    # Every 15 minutes for binary logs (RPO 15 mins)
  workflow_dispatch:           # Manual trigger

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup SSH Key
        env:
          BACKUP_SSH_KEY: ${{ secrets.BACKUP_SSH_KEY }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s' "$BACKUP_SSH_KEY" > "$HOME/.ssh/backup_key"
          chmod 600 "$HOME/.ssh/backup_key"

      - name: Determine Backup Type and Retention
        id: backup_type
        run: |
          DAY_OF_WEEK=$(date +%u)  # 1=Monday, 7=Sunday
          DAY_OF_MONTH=$(date +%d)
          
          # Determine backup type based on date
          if [ "$DAY_OF_MONTH" = "01" ]; then
            echo "BACKUP_TYPE=monthly" >> $GITHUB_OUTPUT
            echo "RETENTION_DAYS=365" >> $GITHUB_OUTPUT
          elif [ "$DAY_OF_WEEK" = "7" ]; then
            echo "BACKUP_TYPE=weekly" >> $GITHUB_OUTPUT
            echo "RETENTION_DAYS=84" >> $GITHUB_OUTPUT  # 12 weeks
          else
            echo "BACKUP_TYPE=daily" >> $GITHUB_OUTPUT
            echo "RETENTION_DAYS=30" >> $GITHUB_OUTPUT
          fi

      - name: Stream MySQL Dump from Docker to Runner
        env:
          SSH_HOST: ${{ secrets.BACKUP_SSH_HOST }}
          SSH_USER: ${{ secrets.BACKUP_SSH_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
          CONTAINER_NAME: ${{ secrets.CONTAINER_NAME }}
        run: |
          echo "📦 Creating database backup..."
          
          ssh -i "$HOME/.ssh/backup_key" \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            "$SSH_USER@$SSH_HOST" \
            "docker exec $CONTAINER_NAME \
              mysqldump \
              --single-transaction \
              --quick \
              --lock-tables=false \
              -u root -p'$DB_PASS' $DB_NAME | gzip -9" \
            > backup.sql.gz
          
          # Verify backup was created
          if [ ! -f backup.sql.gz ] || [ ! -s backup.sql.gz ]; then
            echo "❌ Backup failed - file is empty or missing"
            exit 1
          fi
          
          echo "✅ Backup created successfully - $(du -h backup.sql.gz | cut -f1)"

      - name: Generate Checksum
        run: |
          sha256sum backup.sql.gz > backup.sql.gz.sha256
          echo "🔐 Checksum generated"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload to S3 with Proper Folder Structure
        env:
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          BACKUP_TYPE: ${{ steps.backup_type.outputs.BACKUP_TYPE }}
        run: |
          set -euo pipefail
          
          TIMESTAMP=$(date +"%Y-%m-%d_%H-%M-%S")
          DATE_PATH=$(date +"%Y/%m/%d")
          
          # Create filename with backup type
          FILE="backup-${BACKUP_TYPE}-${TIMESTAMP}.sql.gz"
          CHECKSUM_FILE="${FILE}.sha256"
          
          # Destination path based on backup type
          DEST="s3://${S3_BUCKET_NAME}/mysql-backups/${BACKUP_TYPE}s/${DATE_PATH}/${FILE}"
          DEST_CHECKSUM="s3://${S3_BUCKET_NAME}/mysql-backups/${BACKUP_TYPE}s/${DATE_PATH}/${CHECKSUM_FILE}"
          
          echo "📤 Uploading ${BACKUP_TYPE} backup to S3..."
          echo "   Destination: ${DEST}"
          
          # Upload backup file with correct encryption parameter
          aws s3 cp "./backup.sql.gz" "$DEST" \
            --storage-class STANDARD \
            --sse AES256 \
            --metadata "backup-type=${BACKUP_TYPE},created=$(date -Iseconds),retention-days=${{ steps.backup_type.outputs.RETENTION_DAYS }}"
          
          # Upload checksum with correct encryption parameter
          aws s3 cp "./backup.sql.gz.sha256" "$DEST_CHECKSUM" \
            --storage-class STANDARD \
            --sse AES256
          
          echo "✅ Backup uploaded successfully: ${FILE}"
      
            - name: Apply Retention Policy (GFS)
              env:
                S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
              run: |
                echo "🧹 Cleaning up old backups based on GFS retention policy..."
                
                # Function to delete old backups
                delete_old_backups() {
                  local BACKUP_TYPE=$1
                  local KEEP_COUNT=$2
                  local FOLDER="mysql-backups/${BACKUP_TYPE}s/"
                  
                  echo "   Cleaning ${BACKUP_TYPE} backups (keeping ${KEEP_COUNT})..."
                  
                  # List, sort by date, skip recent, delete old
                  aws s3 ls "s3://${S3_BUCKET_NAME}/${FOLDER}" \
                    --recursive \
                    | sort -r \
                    | awk -v keep="$KEEP_COUNT" 'NR>keep {print $4}' \
                    | while read -r file; do
                        echo "      Deleting: $file"
                        aws s3 rm "s3://${S3_BUCKET_NAME}/$file"
                      done
                }
                
                # Apply retention based on backup type
                # Daily: Keep 30
                delete_old_backups "daily" 30
                
                # Weekly: Keep 12
                delete_old_backups "weekly" 12
                
                # Monthly: Keep 12
                delete_old_backups "monthly" 12
                
                echo "✅ Retention policy applied successfully"

      - name: Generate Backup Report
        if: always()
        run: |
          echo "📊 Backup Report - $(date)" > backup-report.txt
          echo "========================" >> backup-report.txt
          echo "Backup Type: ${{ steps.backup_type.outputs.BACKUP_TYPE }}" >> backup-report.txt
          echo "Backup Size: $(du -h backup.sql.gz | cut -f1)" >> backup-report.txt
          echo "Checksum: $(cat backup.sql.gz.sha256)" >> backup-report.txt
          echo "S3 Bucket: ${{ secrets.S3_BUCKET_NAME }}" >> backup-report.txt
          echo "Status: ${{ job.status }}" >> backup-report.txt
          
          # Upload report to S3 with correct encryption parameter
          aws s3 cp backup-report.txt "s3://${{ secrets.S3_BUCKET_NAME }}/reports/backup-$(date +%Y-%m-%d).txt" \
            --sse AES256

      - name: Notify on Failure
        if: failure()
        run: |
          echo "🚨 BACKUP FAILED!"
          echo "Please check the GitHub Actions logs for details."
          echo "Escalate to Project Leader if not resolved within 4 hours."
          # Optional: Add email/slack notification here

      - name: Cleanup Local Files
        if: always()
        run: |
          rm -f backup.sql.gz backup.sql.gz.sha256
          echo "🧹 Local cleanup completed"
