name: MySQL Backup to S3

on:
  schedule:
    - cron: "0 0 * * *"        # Daily at midnight (00:00)
  workflow_dispatch:           # Manual trigger

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup SSH Key
        env:
          BACKUP_SSH_KEY: ${{ secrets.BACKUP_SSH_KEY }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s' "$BACKUP_SSH_KEY" > "$HOME/.ssh/backup_key"
          chmod 600 "$HOME/.ssh/backup_key"

      - name: Determine Backup Type and Retention
        id: backup_type
        run: |
          DAY_OF_WEEK=$(date +%u)  # 1=Monday, 7=Sunday
          DAY_OF_MONTH=$(date +%d)
          
          if [ "$DAY_OF_MONTH" = "01" ]; then
            echo "BACKUP_TYPE=monthly" >> $GITHUB_OUTPUT
            echo "RETENTION_DAYS=365" >> $GITHUB_OUTPUT
          elif [ "$DAY_OF_WEEK" = "7" ]; then
            echo "BACKUP_TYPE=weekly" >> $GITHUB_OUTPUT
            echo "RETENTION_DAYS=84" >> $GITHUB_OUTPUT
          else
            echo "BACKUP_TYPE=daily" >> $GITHUB_OUTPUT
            echo "RETENTION_DAYS=30" >> $GITHUB_OUTPUT
          fi

      - name: Test Docker and Database Connection
        env:
          SSH_HOST: ${{ secrets.BACKUP_SSH_HOST }}
          SSH_USER: ${{ secrets.BACKUP_SSH_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
          CONTAINER_NAME: ${{ secrets.CONTAINER_NAME }}
        run: |
          echo "Testing SSH connection..."
          ssh -i "$HOME/.ssh/backup_key" -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" "echo 'SSH OK'"
          
          echo "Testing Docker connection..."
          ssh -i "$HOME/.ssh/backup_key" -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
            "docker ps | grep ${CONTAINER_NAME}"
          
          echo "Testing database connection..."
          ssh -i "$HOME/.ssh/backup_key" -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
            "docker exec ${CONTAINER_NAME} mysql -u root -p'${DB_PASS}' -e 'SELECT 1'"
          
          echo "All tests passed!"

      - name: Create MySQL Dump on Server
        env:
          SSH_HOST: ${{ secrets.BACKUP_SSH_HOST }}
          SSH_USER: ${{ secrets.BACKUP_SSH_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
          CONTAINER_NAME: ${{ secrets.CONTAINER_NAME }}
        run: |
          echo "Creating database backup using your manual method..."
          
          # Step 1: Dump the database
          echo "Step 1: Dumping database..."
          ssh -i "$HOME/.ssh/backup_key" -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
            "docker exec ${CONTAINER_NAME} mysqldump -u root -p'${DB_PASS}' ${DB_NAME} > /tmp/prod-backup.sql"
          
          # Step 2: Check file exists and size
          echo "Step 2: Checking backup file..."
          ssh -i "$HOME/.ssh/backup_key" -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
            "ls -lh /tmp/prod-backup.sql"
          
          # Step 3: Compress it
          echo "Step 3: Compressing..."
          ssh -i "$HOME/.ssh/backup_key" -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
            "gzip -f /tmp/prod-backup.sql"
          
          # Step 4: Download it
          echo "Step 4: Downloading..."
          ssh -i "$HOME/.ssh/backup_key" -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
            "cat /tmp/prod-backup.sql.gz" > backup.sql.gz
          
          # Step 5: Clean up on server
          echo "Step 5: Cleaning up..."
          ssh -i "$HOME/.ssh/backup_key" -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
            "rm -f /tmp/prod-backup.sql.gz"
          
          # Step 6: Verify the backup
          FILE_SIZE=$(stat -f%z "backup.sql.gz" 2>/dev/null || stat -c%s "backup.sql.gz" 2>/dev/null)
          echo "Backup file size: $FILE_SIZE bytes"
          
          if [ "$FILE_SIZE" -lt 1000 ]; then
            echo "Backup file is too small ($FILE_SIZE bytes)!"
            exit 1
          else
            HUMAN_SIZE=$(du -h backup.sql.gz | cut -f1)
            echo "Backup created successfully - $HUMAN_SIZE"
          fi

      - name: Generate Checksum
        run: |
          sha256sum backup.sql.gz > backup.sql.gz.sha256
          echo "Checksum generated"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload to S3
        env:
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          BACKUP_TYPE: ${{ steps.backup_type.outputs.BACKUP_TYPE }}
        run: |
          set -euo pipefail
          
          TIMESTAMP=$(date +"%Y-%m-%d_%H-%M-%S")
          DATE_PATH=$(date +"%Y/%m/%d")
          
          FILE="backup-${BACKUP_TYPE}-${TIMESTAMP}.sql.gz"
          CHECKSUM_FILE="${FILE}.sha256"
          
          DEST="s3://${S3_BUCKET_NAME}/mysql-backups/${BACKUP_TYPE}s/${DATE_PATH}/${FILE}"
          DEST_CHECKSUM="s3://${S3_BUCKET_NAME}/mysql-backups/${BACKUP_TYPE}s/${DATE_PATH}/${CHECKSUM_FILE}"
          
          echo "Uploading ${BACKUP_TYPE} backup to S3..."
          echo "   Destination: ${DEST}"
          
          aws s3 cp "./backup.sql.gz" "$DEST" \
            --storage-class STANDARD \
            --sse AES256 \
            --metadata "backup-type=${BACKUP_TYPE},created=$(date -Iseconds),retention-days=${{ steps.backup_type.outputs.RETENTION_DAYS }}"
          
          aws s3 cp "./backup.sql.gz.sha256" "$DEST_CHECKSUM" \
            --storage-class STANDARD \
            --sse AES256
          
          echo "Backup uploaded successfully: ${FILE}"

      - name: Apply Retention Policy (GFS)
        env:
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
        run: |
          echo "Cleaning up old backups based on GFS retention policy..."
          
          # Clean Daily backups - keep 30
          echo "   Cleaning daily backups (keeping 30)..."
          aws s3 ls "s3://${S3_BUCKET_NAME}/mysql-backups/dailys/" --recursive 2>/dev/null \
            | sort -r \
            | awk 'NR>30 {print $4}' \
            | while read -r file; do
                echo "      Deleting: $file"
                aws s3 rm "s3://${S3_BUCKET_NAME}/$file"
              done || true
          
          # Clean Weekly backups - keep 12
          echo "   Cleaning weekly backups (keeping 12)..."
          aws s3 ls "s3://${S3_BUCKET_NAME}/mysql-backups/weeklys/" --recursive 2>/dev/null \
            | sort -r \
            | awk 'NR>12 {print $4}' \
            | while read -r file; do
                echo "      Deleting: $file"
                aws s3 rm "s3://${S3_BUCKET_NAME}/$file"
              done || true
          
          # Clean Monthly backups - keep 12
          echo "   Cleaning monthly backups (keeping 12)..."
          aws s3 ls "s3://${S3_BUCKET_NAME}/mysql-backups/monthlys/" --recursive 2>/dev/null \
            | sort -r \
            | awk 'NR>12 {print $4}' \
            | while read -r file; do
                echo "      Deleting: $file"
                aws s3 rm "s3://${S3_BUCKET_NAME}/$file"
              done || true
          
          echo "Retention policy applied successfully"

      - name: Generate Backup Report
        if: always()
        run: |
          echo "Backup Report - $(date)" > backup-report.txt
          echo "========================" >> backup-report.txt
          echo "Backup Type: ${{ steps.backup_type.outputs.BACKUP_TYPE }}" >> backup-report.txt
          echo "Backup Size: $(du -h backup.sql.gz | cut -f1)" >> backup-report.txt
          echo "Checksum: $(cat backup.sql.gz.sha256)" >> backup-report.txt
          echo "S3 Bucket: ${{ secrets.S3_BUCKET_NAME }}" >> backup-report.txt
          echo "Status: ${{ job.status }}" >> backup-report.txt
          
          aws s3 cp backup-report.txt "s3://${{ secrets.S3_BUCKET_NAME }}/reports/backup-$(date +%Y-%m-%d).txt" \
            --sse AES256 || true

      - name: Notify on Failure
        if: failure()
        run: |
          echo "BACKUP FAILED!"
          echo "Please check the GitHub Actions logs for details."
          echo "Escalate to Project Leader if not resolved within 4 hours."

      - name: Cleanup Local Files
        if: always()
        run: |
          rm -f backup.sql.gz backup.sql.gz.sha256 backup-report.txt
          echo "Local cleanup completed"
