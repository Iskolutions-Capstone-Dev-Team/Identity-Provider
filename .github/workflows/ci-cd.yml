name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - development
      - main
  push:
    branches:
      - development
      - main

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Backend - Format Check
        run: |
          cd backend
          if [ "$(gofmt -l . | wc -l)" -gt 0 ]; then
            echo "The following files are not formatted:"
            gofmt -l .
            exit 1
          fi

      - name: Backend - Staticcheck
        run: |
          cd backend
          go install honnef.co/go/tools/cmd/staticcheck@latest
          $(go env GOPATH)/bin/staticcheck ./...

      - name: Backend - Unit Tests
        run: |
          cd backend
          go test -v -race -coverprofile=coverage.txt -coverpkg=./... -covermode=atomic -skip TestHealthCheck ./...

      - name: Backend - Build Check
        run: |
          cd backend
          go build ./...

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Frontend - Lint
        run: |
          cd frontend
          npm install
          npm run lint

      - name: Frontend - Build Check
        run: |
          cd frontend
          npm run build

  build-and-push:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/main')
    needs: quality-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GH_USERNAME }}
          password: ${{ secrets.GH_PAT }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/iskolutions-capstone-dev-team/idp-backend:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/iskolutions-capstone-dev-team/idp-frontend:latest

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync Repository and Copy Compose file
        env:
          STAGING_HOST: ${{ secrets.STAGING_IP }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_KEY: ${{ secrets.STAGING_SSH_PK }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s' "$STAGING_KEY" > "$HOME/.ssh/staging_key"
          chmod 600 "$HOME/.ssh/staging_key"
          ssh -i "$HOME/.ssh/staging_key" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$STAGING_USER@$STAGING_HOST" \
            '
            set -e
            APP_DIR="$HOME/Identity-Provider"
            COMPOSE_FILE="$APP_DIR/docker-compose.ghcr.yml"

            mkdir -p "$APP_DIR"
            chmod 755 "$APP_DIR"

            if [ -d "$APP_DIR/.git" ]; then
              cd "$APP_DIR"
              git fetch origin development
              git checkout development
              git reset --hard origin/development
            fi

            cat > "$COMPOSE_FILE"
            ' \
            < docker-compose.ghcr.yml

      - name: Deploy and Verify Staging
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_IP }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_PK }}
          script: |
            set -e
            APP_DIR="$HOME/Identity-Provider"
            cd "$APP_DIR"

            if docker compose version >/dev/null 2>&1; then
              DC="docker compose"
            elif docker-compose version >/dev/null 2>&1; then
              DC="docker-compose"
            else
              echo "Error: Neither docker compose nor docker-compose was found."
              exit 1
            fi

            echo "${{ secrets.GH_PAT }}" | \
              sudo docker login ghcr.io -u ${{ secrets.GH_USERNAME }} \
              --password-stdin

            echo "Pulling latest application images..."
            sudo $DC -f docker-compose.ghcr.yml pull backend frontend

            echo "Starting containers..."
            sudo $DC -f docker-compose.ghcr.yml up -d --remove-orphans

            echo "Verifying container health..."
            FAILED=0
            for i in {1..8}; do
              sleep 5
              FAILED=0
              for c in idp_backend idp_frontend; do
                STATUS=$(sudo docker inspect -f '{{.State.Status}}' "$c" 2>/dev/null || echo "missing")
                if [ "$STATUS" != "running" ]; then
                  echo "Attempt $i: Container $c status is $STATUS"
                  FAILED=1
                fi
              done
              if [ "$FAILED" -eq 0 ]; then
                echo "All application containers are running."
                break
              fi
            done

            if [ "$FAILED" -ne 0 ]; then
              TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
              LOG_DIR="$APP_DIR/logs"
              mkdir -p "$LOG_DIR"
              FAIL_LOG="$LOG_DIR/deploy_failure_${TIMESTAMP}.log"
              echo "=== Deployment Failure: Container health check failed at $TIMESTAMP ===" | tee -a "$FAIL_LOG"
              for c in idp_backend idp_frontend; do
                echo "=== Logs for $c (last 50 lines) ===" | tee -a "$FAIL_LOG"
                sudo docker logs --tail 50 "$c" 2>&1 | tee -a "$FAIL_LOG"
              done
              exit 1
            fi

      - name: Cleanup Staging Dangling Images
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_IP }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_PK }}
          script: |
            echo "Pruning dangling images..."
            sudo docker image prune -f

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync Repository and Copy Compose file
        env:
          PRODUCTION_HOST: ${{ secrets.VPS_IP }}
          PRODUCTION_USER: ${{ secrets.VPS_USER }}
          PRODUCTION_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s' "$PRODUCTION_KEY" > "$HOME/.ssh/production_key"
          chmod 600 "$HOME/.ssh/production_key"
          ssh -i "$HOME/.ssh/production_key" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$PRODUCTION_USER@$PRODUCTION_HOST" \
            '
            set -e
            APP_DIR="$HOME/Identity-Provider"
            COMPOSE_FILE="$APP_DIR/docker-compose.ghcr.yml"

            mkdir -p "$APP_DIR"
            chmod 755 "$APP_DIR"

            if [ -d "$APP_DIR/.git" ]; then
              cd "$APP_DIR"
              git fetch origin main
              git checkout main
              git reset --hard origin/main
            fi

            cat > "$COMPOSE_FILE"
            ' \
            < docker-compose.ghcr.yml

      - name: Deploy and Verify Production
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            APP_DIR="$HOME/Identity-Provider"
            cd "$APP_DIR"

            if docker compose version >/dev/null 2>&1; then
              DC="docker compose"
            elif docker-compose version >/dev/null 2>&1; then
              DC="docker-compose"
            else
              echo "Error: Neither docker compose nor docker-compose was found."
              exit 1
            fi

            echo "${{ secrets.GH_PAT }}" | \
              sudo docker login ghcr.io -u ${{ secrets.GH_USERNAME }} \
              --password-stdin

            echo "Pulling latest application images..."
            sudo $DC -f docker-compose.ghcr.yml pull backend frontend

            echo "Starting containers..."
            sudo $DC -f docker-compose.ghcr.yml up -d --remove-orphans

            echo "Verifying container health..."
            FAILED=0
            for i in {1..8}; do
              sleep 5
              FAILED=0
              for c in idp_backend idp_frontend; do
                STATUS=$(sudo docker inspect -f '{{.State.Status}}' "$c" 2>/dev/null || echo "missing")
                if [ "$STATUS" != "running" ]; then
                  echo "Attempt $i: Container $c status is $STATUS"
                  FAILED=1
                fi
              done
              if [ "$FAILED" -eq 0 ]; then
                echo "All application containers are running."
                break
              fi
            done

            if [ "$FAILED" -ne 0 ]; then
              TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
              LOG_DIR="$APP_DIR/logs"
              mkdir -p "$LOG_DIR"
              FAIL_LOG="$LOG_DIR/deploy_failure_${TIMESTAMP}.log"
              echo "=== Deployment Failure: Container health check failed at $TIMESTAMP ===" | tee -a "$FAIL_LOG"
              for c in idp_backend idp_frontend; do
                echo "=== Logs for $c (last 50 lines) ===" | tee -a "$FAIL_LOG"
                sudo docker logs --tail 50 "$c" 2>&1 | tee -a "$FAIL_LOG"
              done
              exit 1
            fi

      - name: Cleanup Production Dangling Images
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Pruning dangling images..."
            sudo docker image prune -f
